name: Dogfood Architecture Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write  # Enable PR architectural summary comments
  issues: write

jobs:
  dogfood:
    name: Self-Dogfooding Architecture Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Analyze Architecture (Dogfooding)
        uses: arcade-agent/analyze-action@1972f1cee124a8e81a4f82df6018a75ab8f41b47 # v1.1.0
        with:
          source-path: 'src'
          output-dir: 'public'
          post-pr-comment: true
          fail-on-smells: false
